[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "research-pdf-parser"
version = "0.3.0"
description = "Tiered native-vector PDF-to-Markdown parsing with validated formula reconstruction"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "GlacierAlgo" }]
keywords = ["pdf", "markdown", "formula", "ocr", "liteparse"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "click>=8.1,<9",
    "liteparse==2.5.0+research.1",
    "pillow>=10,<13",
    "pymupdf>=1.24,<2",
]

[project.optional-dependencies]
formula-cpu = [
    "paddleocr[doc-parser]>=3,<4",
    "paddlepaddle>=3,<4",
]
formula-legacy = ["pix2tex>=0.1.4,<0.2"]

[project.scripts]
research-pdf = "research_pdf_parser.cli:main"
rpdf = "research_pdf_parser.cli:main"

[project.urls]
Repository = "https://github.com/GlacierAlgo/research-pdf-parser"
Issues = "https://github.com/GlacierAlgo/research-pdf-parser/issues"
"LiteParse core" = "https://github.com/GlacierAlgo/research-pdf-parser/tree/main/crates/liteparse"

[tool.uv.sources]
liteparse = { path = "../python", editable = true }

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/research_pdf_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
